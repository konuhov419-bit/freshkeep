# CI/CD FreshKeep. Базовый каркас сгенерирован AI-агентом (Claude) и доработан вручную, см. docs/integration_documentation.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Качество кода (линтинг и форматирование)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=low

  build:
    name: Сборка
    needs: [quality, test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Docker-образ собирается
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t freshkeep:ci .
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Деплой на Railway
    # только пуш в main (не pull request) и только после зелёных проверок
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка настройки деплоя
        id: cfg
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Секрет RAILWAY_TOKEN не задан, деплой пропущен. См. docs/integration_documentation.md"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Выкладка
        if: steps.cfg.outputs.enabled == 'true'
        run: npx --yes @railway/cli@latest up --ci --service "${{ vars.RAILWAY_SERVICE || 'freshkeep' }}"
      - name: Проверка после выкладки (smoke-тест)
        if: steps.cfg.outputs.enabled == 'true' && env.APP_URL != ''
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$APP_URL/api/ready" || true)
            echo "попытка $i: HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 10
          done
          echo "::error::Приложение не готово после выкладки"; cat /tmp/ready.json || true; exit 1
