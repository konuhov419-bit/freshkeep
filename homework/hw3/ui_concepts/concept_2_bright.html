<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreshKeep — Концепция 2: Яркая карточная</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#ffe9d6;display:flex;justify-content:center;padding:20px;font-family:"Trebuchet MS",system-ui,sans-serif;color:#2b2b2b}
.phone{width:390px;height:780px;background:linear-gradient(180deg,#fff7ee,#ffe3ec);border-radius:36px;padding:22px 18px;position:relative;box-shadow:0 8px 30px #0003;overflow:hidden}
.hi{font-size:15px;color:#7a5c4a}h1{font-size:26px;margin:2px 0 14px}
.banner{background:linear-gradient(135deg,#ff7a45,#ff3d71);color:#fff;border-radius:22px;padding:16px;margin-bottom:16px}
.banner b{font-size:18px}.banner p{font-size:13px;opacity:.9;margin-top:4px}
.btn{display:inline-block;margin-top:10px;background:#fff;color:#ff3d71;font-weight:700;border-radius:14px;padding:8px 14px;font-size:13px}
.chips{display:flex;gap:8px;margin-bottom:14px}.chip{padding:7px 14px;border-radius:20px;background:#fff;font-size:13px}.chip.a{background:#2b2b2b;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 12px #0001}
.emo{font-size:34px}.card b{display:block;margin-top:6px}.card small{color:#888}
.bar{height:6px;border-radius:3px;background:#eee;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.fab{position:absolute;right:20px;bottom:86px;width:60px;height:60px;border-radius:20px;background:#2b2b2b;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #0004}
nav{position:absolute;left:14px;right:14px;bottom:14px;height:56px;border-radius:28px;background:#fff;display:flex;justify-content:space-around;align-items:center;font-size:20px;box-shadow:0 4px 12px #0002}
</style></head><body><div class="phone">
<div class="hi">Привет, Анна 👋</div><h1>Что в холодильнике?</h1>
<div class="banner"><b>3 продукта скоро испортятся</b><p>Приготовьте «Омлет с сыром» за 15 минут</p><span class="btn">Смотреть рецепт</span></div>
<div class="chips"><span class="chip a">Все</span><span class="chip">Холодильник</span><span class="chip">Морозилка</span><span class="chip">Шкаф</span></div>
<div class="grid">
<div class="card"><div class="emo">🥛</div><b>Молоко</b><small>сегодня</small><div class="bar"><i style="width:5%;background:#ef4444"></i></div></div>
<div class="card"><div class="emo">🧀</div><b>Сыр</b><small>12 дней</small><div class="bar"><i style="width:80%;background:#22c55e"></i></div></div>
<div class="card"><div class="emo">🍗</div><b>Курица</b><small>3 дня</small><div class="bar"><i style="width:25%;background:#f59e0b"></i></div></div>
<div class="card"><div class="emo">🥚</div><b>Яйца</b><small>9 дней</small><div class="bar"><i style="width:65%;background:#22c55e"></i></div></div>
</div>
<div class="fab">+</div>
<nav><span>🏠</span><span>🍳</span><span>🛒</span><span>👤</span></nav>
</div></body></html>
