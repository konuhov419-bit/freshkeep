nav{position:absolute;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid #dde3ec;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#667}nav .a{color:#0b3a75;font-weight:700}
